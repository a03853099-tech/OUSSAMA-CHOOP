services:
  - type: web
    name: ibrahim-osama-freefire
    runtime: node
    plan: starter
    buildCommand: npm install
    startCommand: npm start
    disk:
      name: freefire-data
      mountPath: /var/data
      sizeGB: 1
    envVars:
      - key: NODE_VERSION
        value: 20
      - key: DB_PATH
        value: /var/data/freefire.sqlite
      - key: ADMIN_PASSWORD
        sync: false
      - key: TOKEN_SECRET
        generateValue: true
